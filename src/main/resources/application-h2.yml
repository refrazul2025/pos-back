server:
  port: ${SERVER_PORT:9000}

spring:
  datasource:
    url: jdbc:h2:file:./data/h2/store;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  # Opcional: permite que Spring cargue scripts al iniciar
  sql:
    init:
      mode: always   # ejecuta los scripts siempre
      data-locations: classpath:data-h2.sql

pos:
  app:
    sequence: "SELECT NEXT VALUE FOR product_seq"